<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — EcoAção</title>
    <link rel="stylesheet" href="../css/style1.css">
</head>
<body class="pagina-auth">

    <div class="container">
        <h1>Crie sua conta</h1>
        <p>Faça parte do EcoAção</p>

        <form id="form-cadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="100"
                   placeholder="Digite seu nome (ou da ONG)" autocomplete="name" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="150"
                   placeholder="Digite seu e-mail" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="6"
                   placeholder="Mínimo de 6 caracteres" autocomplete="new-password" required>

            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha"
                   placeholder="Digite a senha novamente" autocomplete="new-password" required>

            <label for="tipo">Tipo de conta</label>
            <select id="tipo" name="tipo" required>
                <option value="padrao">Usuário padrão</option>
                <option value="ong">ONG</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="aviso" id="mensagem" role="alert" hidden></div>

        <p class="link">
            Já tem conta? <a href="../login/login.html">Entrar</a>
            <br>
            <a href="../index/index.html" class="voltar">Voltar</a>
        </p>
    </div>

    <script src="../comum/comum.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
